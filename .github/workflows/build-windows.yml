name: Build Windows EXEs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build Player and Studio
        run: python scripts/build_exe.py

      - name: Zip distributions
        shell: pwsh
        run: |
          Compress-Archive -Path dist/JKWorldNoBrain/* -DestinationPath "JK世界-冇撚腦ver.zip"
          Compress-Archive -Path dist/JKWorldStudio/* -DestinationPath "JK世界-Studio.zip"
          Compress-Archive -Path dist/JKWorldStudioOwner/* -DestinationPath "JK世界-Studio-Owner.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: JKWorld-Windows
          path: |
            JK世界-冇撚腦ver.zip
            JK世界-Studio.zip
            JK世界-Studio-Owner.zip

      - name: Publish public download release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          $repo = "crazyko2002/JKWorld-Downloads"
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "JK世界-冇撚腦ver.zip" "JK世界-Studio.zip" --clobber --repo $repo
          } else {
            gh release create $tag "JK世界-冇撚腦ver.zip" "JK世界-Studio.zip" --repo $repo --title "JK世界 $tag" --generate-notes --latest
          }

name: Build Windows EXEs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build Player and Studio
        run: python scripts/build_exe.py

      - name: Zip distributions
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SightFlowPlayer/* -DestinationPath SightFlowPlayer.zip
          Compress-Archive -Path dist/SightFlowStudio/* -DestinationPath SightFlowStudio.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SightFlow-Windows
          path: |
            SightFlowPlayer.zip
            SightFlowStudio.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SightFlowPlayer.zip
            SightFlowStudio.zip

